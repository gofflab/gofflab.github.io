name: Rebuild site

# Re-renders the site from data/ and templates/, refreshing publications from PubMed and bioRxiv.
# Runs weekly, on demand, and whenever site sources change on master. Commits the rendered pages back.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/main.py'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'images/**'
      - 'posters/**'

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/main.py
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild site (publications refresh)"
            git push
          fi
