intro:
  draft_flag: true
  text: Octopuses, squid, and cuttlefish have the largest nervous systems of any invertebrate, built on a body plan very different from our own. We study how these brains develop, and what they can teach us about how complex nervous systems evolve. This page offers a short introduction to cephalopods in neuroscience and a reading list for anyone new to the field.

# Prose sections, in page order. `nav` is the label in the page's jump links.
sections:
  - id: about
    nav: About
    heading: About cephalopods
    draft_flag: true
    text:
      - Cephalopods are marine mollusks, related to snails and clams. The living species fall into two groups. The nautiluses keep an external shell. The coleoids, which include octopuses, squid, and cuttlefish, have reduced or lost the shell and depend instead on speed, camouflage, and a large brain. All cephalopods are predators, and most coleoids live only one or two years.
      - Coleoids have the largest nervous systems of any invertebrate, with neuron numbers comparable to those of small mammals [@deryckere2021; @lassnig2026]. Much of this nervous system lies outside the brain. The arms of an octopus contain neural networks that can drive complex movements with little direction from the brain [@sumbre2001]. These animals learn and remember, use tools, and change the color and pattern of their skin to blend into their surroundings [@elagoz2024].
      - Cephalopods and vertebrates last shared a common ancestor about 580 million years ago [@elagoz2024]. Their large brains, camera-type eyes, and complex behaviors evolved independently [@napoli2022]. Cephalopods therefore offer a rare natural experiment, a second and separate solution to the problem of building a large and capable brain.

  - id: history
    nav: History
    heading: Cephalopods in the history of neuroscience
    draft_flag: true
    text:
      - Cephalopods have shaped neuroscience for nearly a century. In 1936, J. Z. Young recognized that the giant nerve fibers of the squid, up to about a millimeter across, are single axons [@keynes2005]. Their size made it possible to thread electrodes inside a living axon. Hodgkin and Huxley used the squid giant axon to measure the ionic currents behind the action potential and to describe them in a mathematical model still in use today [@hodgkin1952]. The work earned them a share of the 1963 Nobel Prize.
      - The squid giant synapse did the same for synaptic transmission. Katz and Miledi used it to show that depolarizing the presynaptic terminal releases transmitter even when action potentials are blocked [@katz1967]. Squid axons also gave cell biologists a view of the interior of a neuron. Axoplasm squeezed from the giant axon let researchers watch organelles travel along microtubules, work that led to the discovery of the motor protein kinesin [@vale1985].
      - The octopus, meanwhile, became a model for learning and memory. Boycott and Young identified brain regions required for memory, including the vertical lobe [@boycott1955]. Decades later, recordings from the vertical lobe revealed long-term potentiation, the activity-dependent strengthening of synapses thought to underlie memory in the vertebrate hippocampus [@hochner2003].
      - Genomics brought new surprises. The first octopus genome revealed large expansions of two gene families, the protocadherins, which regulate neuronal development, and the C2H2 zinc-finger transcription factors. Both were previously thought to be greatly enlarged only in vertebrates [@albertin2015]. Coleoids also recode many neural proteins through A-to-I RNA editing, on a scale not seen in other animals [@liscovitchbrauer2017].

  - id: models
    nav: Model organisms
    heading: A non-traditional model organism
    draft_flag: true
    text:
      - Most of what we know about brain development comes from a few species, chiefly mice, zebrafish, flies, and worms. Studying an animal as distant from these as a cephalopod tests which features of brain development are universal and which belong to one lineage. Where cephalopods and vertebrates share a mechanism, it may reflect a deep constraint on how large brains can be built. Where they differ, they reveal alternatives that the standard models cannot show us.
      - For most of their history in the laboratory, cephalopods were wild-caught adults, prized for a few remarkable cells or behaviors, and genetics and developmental biology in these animals lagged far behind. That gap is closing. Genome assemblies are now available for several species [@albertin2015; @destanovic2023]. CRISPR-Cas9 gene knockout works efficiently in squid embryos [@crawford2020], and an albino line of the hummingbird bobtail squid made this way allows imaging of neural activity in living animals [@ahuja2023]. Single-cell atlases have begun to catalog the cell types of octopus and squid brains [@styfhals2022; @songcocasey2022; @duruz2023], and multiplexed in situ hybridization with tissue clearing can map gene expression across whole embryos [@elagoz2022].
      - Just as important, several species can now be raised through their full life cycle in the laboratory. The hummingbird bobtail squid, <em>Euprymna berryi</em>, is one of our model systems of choice as it produces large numbers of embryos and can be cultured throughout its life [@ahuja2023]. Another model used in our lab, The lesser Pacific striped octopus, or <em>Octopus chierchiae</em>, is small and breeds repeatedly, unlike most octopuses[@grearson2021]. #For the common octopus, an incubation system and staging atlas have opened embryonic development to laboratory study [@deryckere2020].
      #- Research with cephalopods also carries responsibilities. European Union rules adopted in 2010 extend animal research protections to cephalopods, the only invertebrates they cover, and researchers have worked to define standards for their care and welfare [@fiorito2014].

# Frontier questions, shown as a grid of cards.
frontier:
  id: frontier
  nav: Open questions
  heading: Open questions in cephalopod neurodevelopment
  draft_flag: true
  intro: Coleoid embryos develop directly, without metamorphosis, from large yolk-rich eggs [@buresi2016]. Their central nervous system follows the molluscan plan, a ring of ganglia around the esophagus, yet parts of its development resemble that of vertebrates [@elagoz2024]. These are the questions we find most exciting.
  items:
    - title: Where neurons come from
      question: How do neurons born outside the brain find their proper places?
      text: A hatchling squid's brain is a fraction of its adult size, so new neurons must keep arriving long after the embryo is built. In juvenile hummingbird bobtail squid, <em>Euprymna berryi</em>, we labeled newly divided cells and used spatial transcriptomics to follow where they are born and where they settle. New neurons arise outside the central nervous system, in a neurogenic zone in the periocular space, and enter the brain along several migratory streams, each supplying different brain regions (Stock et al., in press). What directs each stream to its target, and how arriving neurons wire into circuits already in use, are open questions.
    - title: Glia in the cephalopod brain
      question: What role(s) do non-neuronal cells play in the functioning cephalopod brain?
      text: Glia were first described in the octopus brain in 1896, yet they have received far less attention than neurons [@ponte2025]. And what little we do know about non-neuronal cell types suggests that they differ from vertebrate glia in important ways. Whether cephalopod glia also buffer ions and transmitters, fuel neurons, or tune synapses, as vertebrate glia do, is largely unexplored. We are interested in how glia contribute to the proper brain function and homeostasis in cephalopods, and how their developmental origins compare to their vertebrate counterparts.
    - title: Convergent or conserved?
      question: When cephalopods and vertebrates build similar structures, do they use the same developmental tools?
      text: Squid retinal development uses mechanisms that are hallmarks of the vertebrate retina, including nuclear migration in dividing progenitors and Notch signaling that controls cell fate [@koenig2016; @napoli2022]. Yet the squid lens borrows a gene network that patterns limbs in other animals [@neal2022], and in the cuttlefish embryo, genes that pattern the nervous system from midline to edge appear in a reversed arrangement [@buresi2016]. Separating shared constraints from independent inventions is a central task for the field.
    - title: Cell type diversity
      question: How does a cephalopod brain generate its many kinds of neurons?
      text: Single-cell atlases now catalog neurons and glia in octopus and squid [@styfhals2022; @songcocasey2022; @duruz2023]. Neural progenitors express conserved neurogenic transcription factors such as achaete-scute and neurogenin [@deryckere2021], but cephalopods have also expanded gene families, including protocadherins and microRNAs [@albertin2015; @zolotarov2022], and extensively recode proteins using RNA editing [@liscovitchbrauer2017]. How these innovations help specify cell identity during development is largely unknown.
    - title: A brain that keeps growing
      question: How does a brain keep adding neurons while it is already in use?
      text: Young cephalopods must hunt and evade predators with a brain far smaller than an adult's. Neurogenesis continues after hatching, at least in tissues such as the cuttlefish retina [@ariasmontecino2024]. Where new neurons arise in the growing brain, how they join working circuits, and how experience shapes this growth are open questions, and central to <a href="research.html#interests">our own work</a>.
    - title: Development in a changing ocean
      question: How do temperature, salinity, and ocean acidification shape the developing nervous system?
      text: Cephalopod embryos develop at the temperature of the surrounding sea. Chronic heat stress turns down genes for nervous system development in octopus embryos [@galindotorres2024], and octopuses change RNA editing at more than 13,000 codons, many in neural proteins, after a shift in water temperature [@birk2023]. Whether such flexibility protects the developing brain as oceans warm remains to be seen.

# "Papers worth reading": each item names a key under `references`, plus a one-line note.
reading:
  id: reading
  nav: Papers worth reading
  heading: Papers worth reading
  draft_flag: true
  intro: Recent work on embryonic neurodevelopment in cephalopods, newest first. If you are new to the field, start with the review by Elagoz and colleagues.
  items:
    - ref: lassnig2026
      note: Single-cell multiomics of octopus embryos reveals an early glial population that may organize neuronal migration and wiring.
    - ref: elagoz2024
      note: A review of neurogenesis, migration, and patterning in coleoid embryos, with a clear account of open problems. The best place to start.
    - ref: napoli2022
      note: Live imaging shows that squid retinal neurogenesis relies on nuclear migration and Notch signaling, hallmarks of the vertebrate retina.
    - ref: styfhals2022
      note: A cell type atlas of the young octopus brain, mapped onto brain lobes, in which vertical lobe cells resemble the Kenyon cells of flies.
    - ref: elagoz2022
      note: A protocol for whole-mount multiplexed HCR, immunostaining, clearing, and light-sheet imaging of octopus embryos, with code for probe design.
    - ref: neal2022
      note: The squid lens develops using the gene network that patterns the limbs of flies, a striking case of co-option.
    - ref: deryckere2021
      note: Neural progenitors outside the octopus brain generate neurons that migrate long distances to reach their lobes.
    - ref: deryckere2020
      note: An incubation system and staging atlas that make octopus embryos practical to study in the laboratory.
    - ref: koenig2016
      note: Establishes squid eye development as an experimental model, with lineage tracing and functional tests of Notch signaling.
    - ref: buresi2016
      note: Neural patterning genes in cuttlefish embryos show how a yolk-rich egg rearranges a conserved body plan.

