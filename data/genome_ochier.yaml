# O. chierchiae genome resource page (octopus_genome.html). Carried over verbatim.
# Download links point at Dropbox for now; swap 'url' values once the assembly is deposited.
# NOTE: the stringtie annotation .xlsx row repeats the type/size/MD5 of the row above it on the old site (needs correct values).

