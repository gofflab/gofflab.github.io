alumni:
- name: Genevieve Stein-O'Brien, Ph.D.
  role: <a href="https://kavlijhu.org/" target="_blank">Kavli NDI</a> Postdoctoral Fellow
  photo: Genevieve.jpg
  alt: Genevieve Stein-O'Brien
  email: gsteinobrien@gmail.com
  bio: Dr. Stein-O'Brien is a post doctoral fellow in Oncology Biostatics and Bioinformatics and Neuroscience Departments at Johns Hopkins University with affiliations in the McKusick-Nathans Institute of Genomics Medicine and Institute for Data Intensive Engineering and Science. In 2017, she received a PhD in Human Genetics from Johns Hopkins School of Medicine and a MHS in Biostatistics from Johns Hopkins School of Public Health. Dr. Stein-O'Brien's research is focused on the stochastic processes underlying gene regulation in dynamic biological systems. Specifically, she develops computational and statistical methods for pattern detection and data integration in high-throughput genomics.
- name: Jonathan Augustin
  role: Ph.D., Biochemistry, Cellular and Molecular Biology Graduate Program; NSF Graduate Fellow
  photo: jaugustin.jpg
  email: jaugust7@jhmi.edu
  bio: Jonathan received his Ph.D. from the BCMB program in 2022. He is currently a postdoctoral scholar at the Eli and Edythe Broad Center of Regeneration Medicine and Stem Cell Research, Lab of Dr. Arnold Kriegstein. Prior to joining our lab, he was a research technician in the lab of Dr. Hao Jiang at the University of Alabama at Birmingham. He did his undergraduate work at Maryville College in Tennessee where he earned his B.A. in Biochemistry, and a minor in Mathematics.
- name: Elizabeth Vincent
  role: 'Ph.D. Candidate, Human Genetics Graduate Program, Current: Postdoc with the Beier & Shendure Labs at UW/Seattle Children''s Hospital'
  photo: Elizabeth_Vincent_2.jpg
  email: liz.vincent92@gmail.com
  bio: Liz joined the Human Genetics program in August 2015 after receiving her B.A. in Chemistry from Yale University. Her undergraduate thesis involved a genetic study of a trio of individuals to identify a causal variant for a specific neurological disorder. She brings with her experience in both experimental and computation biology. Her thesis project includes a characterization of newborn enteric neurons in a mouse model of Hirschsprung Disease, and identifying the specific role(s) for the receptor tyrosine kinase RET in regulating neural fate specification in the mammalian gut.
