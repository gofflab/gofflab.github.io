current:
- name: Loyal Goff
  role: Principal Investigator
  photo: Goff_color.jpg
  alt: Loyal Goff, PI
  email: loyalgoff@jhmi.edu
  bio: Dr. Goff is an Associate Professor in the Departments of Neuroscience and <a href="https://igm.jhmi.edu/">Genetic Medicine</a> at the Johns Hopkins University School of Medicine. His postdoctoral work, under the joint mentorship of Drs. John Rinn (Harvard, SCRB) and Manolis Kellis (MIT, CSAIL), focused on the discovery, annotation, and characterization of long noncoding RNAs across a range of cellular and developmental contexts. The Goff Lab develops single cell and spatial transcriptomics assays and computational tools, and applies them to neural development in cephalopods.
