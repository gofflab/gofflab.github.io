- name: Gloria Shin
  role: Research Technologist
  photo: missing.png
  bio_hidden: A graduate of the Johns Hopkins Human Genetics graduate program, Gloria has found her way back to the Miller Research Building as a member of the Goff lab. Gloria is coordinating our collaborative single cell experiments and is the point of contact for the developing Single Cell Innovation Lab.
- name: Victoria Hoskins
  role: 'Ph.D., Human Genetics Graduate Program, Current: Postdoc, UNC Chapel Hill'
  photo: Tori.jpg
  bio_hidden: Tori Hoskins hails from the hometown of Krispy Kreme Doughnuts where she attended Wake Forest University and earned a B.S. in Biology and minors in Chemistry and Anthropology. She is currently a PhD Candidate in the Human Genetics program at The Johns Hopkins School of Medicine and is jointly mentored by Loyal Goff and Karen Reddy. Her project is focused on understanding how Lamina Associated Domains are re-established after mitosis.
- name: Briana Winer
  role: 'Research Technologist, Current: JHU CMM Graduate Program'
  photo: Briana.jpg
  email: bwiner2@jhmi.edu
  bio_hidden: Briana, born and raised in Baltimore County, received her B.S. in Biochemistry from Stevenson University. Whilst an undergrad, she retained membership in various honor societies, such as, Beta Beta Beta, Gamma Sigma Epsilon, and Sigma Xi. She was also highly involved in the Phi Sigma Sigma sorority. She completed a Capstone Research Project at the Johns Hopkins Bloomberg School of Public Health under the mentorship of Dr. Janice Evans. This project focused on optimizing antibody conditions for determining protein localization within mouse oocytes. Briana also participated in a semester long course, at her alma mater, doing research on the role of ubiquitination and its' effect on stem cell differentiation and lineage determination. While she hopes to contribute her knowledge and dedication to our lab, she remains focused on her goal of becoming an Embryologist in the near future.
