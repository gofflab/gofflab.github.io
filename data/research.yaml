# Research page content.
# 'draft_flag: true' shows a small DRAFT badge: text written for review, not yet approved.

approach:
  draft_flag: false
  text:
    - We are a computational and experimental molecular neuroscience lab. We develop single cell and spatial transcriptomics assays in conjunction with the computational tools required to analyze these data.
    - We adapt and apply these tools to challenging biological systems where standard assays often struggle.
    - One area of particular interest is exploring novelty in understudied species, including Cephalopods. We have optimized our methods for marine invertebrates, from tissue preparation through analysis, working closely in partnership with other Cephalopod research labs throughout the world.
    - We are a (self-described) 'scrappy' group of molecular tinkerers, who appreciate a collaborative approach to science. If you are interested in working with us, please reach out.
    - All of our software tools are open source and listed under <a href="tools.html">Tools &amp; Data</a>.

# Research interests: the biological questions the lab is pursuing now.
interests:
  draft_flag: false
  heading: Research interests
  intro: Cephalopods and vertebrates last shared a common ancestor more than 600 million years ago, yet both evolved large, centralized brains that support complex behavior. Comparing how these 'maximally divergent' brains develop can reveal both universal principles of neural development and others more particular to one lineage.
  items:
    - title: Brain organization
      question: How does a cephalopod brain develop at the level of cell types and circuits?
      text: The cephalopod central brain is divided into dozens of lobes with distinct roles in learning, vision, motor control, and other functions. We combine single nucleus RNA-seq with spatial transcriptomics to map cell types, their molecular signatures, and their spatial organization across these lobes to learn how cephalopod brains arise, and how they function once assembled.
    - title: Continuous brain growth
      question: How and where are new neurons born to supply the growing brain?
      text: A squid hatchling's brain is a fraction of its adult size, so new neurons must continuously be generated long after embryonic development. By labeling newly divided cells in juvenile squid and inferring their positions and identity with spatial transcriptomics, we are mapping neurogenic zones and learning how different types of neurons know where to end up and who to talk to. We are interested in questions about how different conditions and experiences shape the growth of the brain, whether different regions of the brain grow at different rates, and how a cephalopod brain maintains its function while it is growing.
    - title: Neural progenitor commitment and fate specification
      question: When do neural stem cells commit to a fate, and which programs specify neuronal identity?
      text: Many transcription factors that control neurogenesis in vertebrates, including Ascl1, Sox2, and Pax6, have cephalopod counterparts. We ask whether these genes play similar roles in a brain that evolved independently, and use cross-species transfer learning to compare fate-specifying programs with those in more well-studied species. We also find that there are many new (to us) genes in cephalopods that also appear to play a role in brain development and fate specification. Whether these genes are cephalopod-specific innovations, and whether we can learn anything about their function by comparing them to genes in other species, is an open question we are pursuing.
    - title: Neuropeptides and lineage-specific genes
      question: Which molecular innovations distinguish cephalopod neurons?
      text: Neuropeptides account for much of the transcriptional diversity we see across the cephalopod brain, and several cephalopod gene families have expanded far beyond their counterparts in other animals. Furthermore, cephalopods have developed completely novel sensory, signaling, and other functional neural systems where we have little precident for comparison. We study how lineage-specific genes and regulatory networks contribute to neural cell type identity and to the evolution of a complex brain.

# Past research themes. Text adapted from the previous homepage (copy-edited Oct 2026).
# Papers attach to a theme via 'themes:' tags in data/publications.yaml (DRAFT tagging).
past_themes:
  - id: variation
    title: Transcriptional variation as a cellular phenotype
    question: How does variation within and between cell types shape what a cell does?
    text:
      - Every cell in the brain is unique. Differences in gene expression between discrete cell types help define how those cells function and connect within the nervous system. Continuous sources of variation matter as well. Spatial position, activity state, and responses to injury or inflammation all change how an individual cell behaves.
      - By measuring gene expression in single cells within their native tissue, we have asked how regional position, morphology, axonal targets, and circuit integration shape cell type-specific states in the mammalian nervous system.
  - id: fate
    title: Cell fate specification during neural development
    question: How does a handful of progenitors generate the many cell types of the nervous system?
    text:
      - Only a few precursor cell types give rise to the striking diversity of cells in the mammalian brain and enteric nervous system. We have worked to understand how a cell comes to adopt a particular fate. That work includes cataloging cell types and their features, following how they assemble into a functioning nervous system during development, and identifying the genes and gene networks that govern fate decisions.
  - id: disease
    title: Cell type-specific responses in health and disease
    question: Why are some cell types more vulnerable to degeneration than others?
    text:
      - Neurodegenerative disorders destroy specific populations of cells, and different disorders are often distinguished only by which neurons or brain regions they affect. We have used single cell measurements to reconstruct how neuronal populations respond to, and succumb to, disease-associated variants and conditions. Learning why some cell types are vulnerable while others are spared points toward therapeutic options for these debilitating disorders.
  - id: lncrna
    title: Long noncoding RNAs
    question: How do long noncoding RNAs function in the developing and adult brain to regulate gene expression?
    text:
      - Building on Dr. Goff's postdoctoral work helping to annotate thousands of human and mouse long intergenic noncoding RNAs, we have mapped lncRNA expression across the developing mouse brain, characterized knockout mouse models showing that some lncRNAs are required for viability and brain development, and studied how individual lncRNAs such as Pantr2 shape the cell fate potential of neural progenitors.
  - id: computational_methods
    title: Computational methods for single cell and spatial data
    question: How can patterns learned in one dataset be transferred to another dataset for exploration?
    text:
      - Single cell and spatial assays produce information-rich datasets that summarize the states of individual cells and their spatial context. We develop methods to discover these patterns of coordinated gene expression that represent distinct cell states, types, and biological features. We can transfer the patterns learned in one dataset to another to facilitate cross-dataset comparisons, and make inferences about the persistence or changes in cell states under different conditions.
