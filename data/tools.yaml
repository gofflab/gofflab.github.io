# Software, datasets, and lab code snippets (merged from software.html, datasets.html, lab_resources.html).
# Text carried over verbatim. Fields may contain inline HTML.

software:
- name: pySeq 2501
  url: https://github.com/chaichontat/pyseq2501
  image: pyseq.png
  author: Chaichontat Sriworarat
  description: <em><b>Control your HiSeq 2000/2500 with ease.</b></em> pyseq2501 is an adaptation and refactoring of the <a href="https://github.com/nygctech/PySeq2500" target="_blank">pyseq 2500</a> controller software to repurpose your aging, unsupported HiSeq 2500 machine into a useful fluidics + microscopy platform for custom workflows.
- name: TRICycle
  url: https://github.com/hansenlab/tricycle
  image: tricycle_sticker.png
  description: TRICycle (Transferable Representation and Inference of Cell Cycle) is an R package for rapid and universal annotation of cell cycle state for large-scale single cell assays. Building off of the ProjectR package for transfer learning, tricycle embeds new single cell RNA-Seq, ATAC-Seq, or other single cell assays into a reference latent space to enable the rapid estimation of continuous position along a cell cycle trajectory. This projection is fast, memory-efficient, requires only minimal data preprocessing, and requires no <em>a priori</em> knowledge of cellular annotations. The speed, efficiency, and accuracy of tricycle enables annotation of atlas-level single cell datasets for exploration of cell cycle dynamics at scale.
- name: projectR
  url: https://github.com/genesofeve/projectR
  image: projectR.png
  description: ProjectR is a regression-based trasfer learning tool for single cell analysis. ProjectR can embed any type of high-throughput molecular biology assay into the latent spaces learned from a source dataset to facilitate rapid annotation of cell types or biological features. Because projecting these dimensions preserves relative distances between samples, biologically meaningful relationships/factors will stratify new data consistent with their underlying processes, allowing labels or information from one dataset to be used for annotation of the other. ProjectR can reveal novel parallels between gene expression programs in other tissues, species and cellular assays. We have used this approach to transfer cell type and state designations across datasets to rapidly annotate cellular features in a new dataset without a priori knowledge of their type, identify a species-specific signature of microglial cells, and identify a previously undescribed subpopulation of neurosecretory cells
    within the lung.
- name: CummeRbund
  url: http://compbio.mit.edu/cummeRbund
  image: cummeRbund_gold.png
  description: An R/Bioconductor package for the persitent storage, manipulation, analysis, and visualization of Cufflinks RNA-Seq data. High-throughput sequencing of RNA-fragments is a powerful technique with many applications. The results of these analyses is often very large data sets with a high degree of relations between various data types and can be somewhat overwhelming. CummeRbund was designed to help simplify the analysis and exploration portion of RNA-Seq data derived from the output of a differential expression analysis using cuffdiff, with the goal of providing fast and intuitive access to your results. CummeRbund takes the various output files from a cuffdiff run and creates a SQLite database of the results describing appropriate relationships betweeen genes, transcripts, transcription start sites, and CDS regions. Once stored and indexed, data for these features, even across multiple samples or conditions, can be retrieved very efficiently and allows the user to explore subfeatures
    of individual genes, or genesets as the analysis requires.
- name: DeCoN
  url: http://decon.fas.harvard.edu/
  image: decon.png
  description: The Developing Cortical Neuron Transcriptional Resource. DeCoN is a web utility for the exploration of deep transcriptional profiling (RNA-Seq) data derived from sorted populations of mouse cortical projection neurons. This utility presents comprehensive isoform, gene, and geneset analyses of expression levels for Callosal, Subcerebral, and Corticothalamic projection neurons during corticogenesis.
datasets:
