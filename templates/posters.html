{% extends "base.html" %}
{% import '_macros.html' as m with context %}
{% block content %}
<header class="page-head has-accent">
  {{ m.accent(page) }}
  <div class="wrap">
    <h1>Posters</h1>
    <nav class="subnav" aria-label="Related"><a href="{{ root }}publications.html">Publications</a></nav>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Year</th><th>Poster</th><th>Size</th></tr></thead>
        <tbody>
        {% for p in posters %}
          <tr>
            <td class="mono">{{ p.year or '' }}</td>
            <td><a href="{{ p.file|urlencode }}">{{ p.label }}</a></td>
            <td class="mono" style="white-space:nowrap">{{ p.size }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}
